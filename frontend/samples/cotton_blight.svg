<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#F4F6F0" rx="16"/>
  <!-- Cotton Leaf (Palmate 5-lobed shape) -->
  <path d="M 200 360 L 200 240 L 90 280 L 70 180 L 150 140 L 120 40 L 200 100 L 280 40 L 250 140 L 330 180 L 310 280 Z" fill="#2E7D4E"/>
  <!-- Angular water-soaked lesions bounded by veins -->
  <polygon points="170,120 190,130 185,150 165,145" fill="#742A2A" stroke="#2B6CB0" stroke-width="2"/>
  <polygon points="210,130 230,125 240,145 220,155" fill="#742A2A" stroke="#2B6CB0" stroke-width="2"/>
  <polygon points="140,180 160,175 165,195 145,200" fill="#4A5568" stroke="#2B6CB0" stroke-width="2"/>
  <polygon points="240,180 260,185 255,205 235,195" fill="#742A2A" stroke="#2B6CB0" stroke-width="2"/>
  <!-- Water soaked halos -->
  <circle cx="180" cy="135" r="18" fill="#63B3ED" opacity="0.3"/>
  <circle cx="225" cy="140" r="20" fill="#63B3ED" opacity="0.3"/>
  <circle cx="152" cy="188" r="16" fill="#63B3ED" opacity="0.3"/>
  <!-- Badge -->
  <rect x="20" y="20" width="170" height="32" rx="8" fill="#D97706"/>
  <text x="105" y="41" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">COTTON BLIGHT</text>
</svg>
