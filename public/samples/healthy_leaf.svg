  <path d="M 185 200 Q 125 150 110 100" stroke="#15803D" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 183 140 Q 245 100 255 70" stroke="#15803D" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Glossy leaf shine -->
