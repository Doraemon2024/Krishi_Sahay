<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#F4F6F0" rx="16"/>
  <!-- Leaf Stem & Base -->
  <path d="M 200 370 Q 200 240 180 40" fill="none" stroke="#2E7D4E" stroke-width="12" stroke-linecap="round"/>
  <!-- Blade -->
  <path d="M 180 40 C 90 120 70 280 200 370 C 330 280 310 120 180 40 Z" fill="#38A169" opacity="0.9"/>
  <!-- Leaf Veins -->
  <path d="M 190 310 Q 140 260 120 220" stroke="#1E4D3B" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 190 260 Q 250 220 270 180" stroke="#1E4D3B" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 185 200 Q 130 160 110 120" stroke="#1E4D3B" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Diamond Blast Lesions -->
  <g fill="#A0AEC0" stroke="#742A2A" stroke-width="5">
    <!-- Lesion 1 -->
    <polygon points="180,140 205,170 180,200 155,170" fill="#E2E8F0"/>
    <ellipse cx="180" cy="170" rx="8" ry="12" fill="#742A2A"/>
    <!-- Lesion 2 -->
    <polygon points="230,210 250,235 230,260 210,235" fill="#CBD5E0"/>
    <ellipse cx="230" cy="235" rx="6" ry="9" fill="#9B2C2C"/>
    <!-- Lesion 3 -->
    <polygon points="140,230 158,250 140,270 122,250" fill="#E2E8F0"/>
  </g>
  <!-- Yellow Halos around lesions -->
  <ellipse cx="180" cy="170" rx="35" ry="45" fill="#D97706" opacity="0.25"/>
  <ellipse cx="230" cy="235" rx="28" ry="36" fill="#D97706" opacity="0.25"/>
  <!-- Badge -->
  <rect x="20" y="20" width="130" height="32" rx="8" fill="#DC2626"/>
  <text x="85" y="41" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RICE BLAST</text>
</svg>
