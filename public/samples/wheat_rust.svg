<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#F4F6F0" rx="16"/>
  <!-- Long Wheat Leaf Blade -->
  <path d="M 120 370 Q 200 200 280 30 C 260 90 220 250 140 370 Z" fill="#2E7D4E"/>
  <path d="M 120 370 Q 200 200 280 30" stroke="#1B4D3E" stroke-width="4" fill="none"/>
  <!-- Linear Yellow Stripe Rust Pustules -->
  <g fill="#ECC94B">
    <!-- Stripe 1 -->
    <rect x="180" y="120" width="8" height="45" rx="4" fill="#D69E2E"/>
    <rect x="180" y="175" width="8" height="35" rx="4" fill="#ECC94B"/>
    <rect x="180" y="220" width="8" height="50" rx="4" fill="#D69E2E"/>
    
    <!-- Stripe 2 -->
    <rect x="195" y="90" width="7" height="30" rx="3" fill="#D69E2E"/>
    <rect x="195" y="130" width="7" height="60" rx="3" fill="#ECC94B"/>
    <rect x="195" y="200" width="7" height="40" rx="3" fill="#D69E2E"/>

    <!-- Stripe 3 -->
    <rect x="165" y="160" width="7" height="50" rx="3" fill="#D69E2E"/>
    <rect x="165" y="220" width="7" height="30" rx="3" fill="#ECC94B"/>
  </g>
  <!-- Powdery Dust Effect -->
  <circle cx="184" cy="140" r="16" fill="#F6E05E" opacity="0.35"/>
  <circle cx="199" cy="150" r="18" fill="#F6E05E" opacity="0.35"/>
  <circle cx="184" cy="240" r="14" fill="#F6E05E" opacity="0.35"/>
  <!-- Badge -->
  <rect x="20" y="20" width="160" height="32" rx="8" fill="#DC2626"/>
  <text x="100" y="41" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">WHEAT YELLOW RUST</text>
</svg>
